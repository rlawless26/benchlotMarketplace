name: CI/CD Pipeline

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Run tests
        run: npm test -- --watchAll=false
      
      - name: Check linting
        run: npm run lint || echo "Linting issues found, but continuing"
        continue-on-error: true
        
  # The deploy job that lived here (amondnet/vercel-action --prod) is gone on
  # purpose. It had never actually run — it needed the test job, which was red
  # from 2026-05-04 until 2026-09-01 — and both Vercel projects now deploy via
  # git integration on push to main (benchlot-marketplace from the repo root,
  # benchlot-web from web/). Re-adding it would deploy every commit twice.
