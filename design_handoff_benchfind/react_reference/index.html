<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Benchfind — UI Kit</title>
  <link rel="icon" href="../../assets/favicon.svg">
  <link rel="stylesheet" href="../../colors_and_type.css">
  <script src="https://unpkg.com/lucide@0.453.0/dist/umd/lucide.min.js"></script>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>
    html, body { margin: 0; background: var(--paper-50); }
    body { font-family: var(--font-body); color: var(--ink-900); }

    /* Screen-switcher chrome (UI Kit demo only — not part of the kit itself) */
    .kit-tabs {
      position: sticky; top: 0; z-index: 50;
      display: flex; gap: 4px; padding: 8px 32px;
      background: var(--ink-900); color: var(--paper-50);
      border-bottom: 1px solid #000;
    }
    .kit-tab {
      font-family: var(--font-body); font-size: 12px; font-weight: 500;
      padding: 6px 12px; border-radius: var(--radius-sm);
      cursor: pointer; background: transparent; color: var(--paper-300);
      border: none;
    }
    .kit-tab:hover { background: rgba(255,255,255,0.08); color: var(--paper-50); }
    .kit-tab.active { background: #1F4D3A; color: var(--paper-50); }
    .kit-label {
      font-family: var(--font-display); font-size: 13px; font-weight: 500;
      color: #94B3A2; margin-right: 12px;
      align-self: center; letter-spacing: -0.01em;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="Primitives.jsx" data-presets="env,react"></script>
  <script type="text/babel" src="Chrome.jsx" data-presets="env,react"></script>
  <script type="text/babel" src="Landing.jsx" data-presets="env,react"></script>
  <script type="text/babel" src="ScanResult.jsx" data-presets="env,react"></script>
  <script type="text/babel" src="Screens.jsx" data-presets="env,react"></script>

  <script type="text/babel" data-presets="env,react">
    const { useState, useEffect } = React;

    function App() {
      const [screen, setScreen] = useState('landing');
      useEffect(() => { if (window.lucide) window.lucide.createIcons(); }, [screen]);

      const tabs = [
        { id: 'landing',    label: 'Landing' },
        { id: 'result-hi',  label: 'Scan · High' },
        { id: 'result-med', label: 'Scan · Medium + hint' },
        { id: 'reference',  label: 'Plane reference' },
        { id: 'gate',       label: 'Category gate' },
      ];

      return (
        <>
          <div className="kit-tabs" data-screen-label="UI Kit Tabs">
            <span className="kit-label">Bench<span style={{ color: '#94B3A2', fontStyle: 'italic' }}>f</span>ind UI Kit</span>
            {tabs.map(t => (
              <button key={t.id}
                onClick={() => setScreen(t.id)}
                className={`kit-tab ${screen === t.id ? 'active' : ''}`}>
                {t.label}
              </button>
            ))}
          </div>
          {screen === 'landing'    && <div data-screen-label="01 Landing"><LandingScreen onScan={() => setScreen('result-hi')} /></div>}
          {screen === 'result-hi'  && <div data-screen-label="02 Scan High"><ScanResultScreen confidence="high"   onBack={() => setScreen('landing')} /></div>}
          {screen === 'result-med' && <div data-screen-label="03 Scan Medium"><ScanResultScreen confidence="medium" onBack={() => setScreen('landing')} /></div>}
          {screen === 'reference'  && <div data-screen-label="04 Reference"><ReferenceScreen onBack={() => setScreen('landing')} /></div>}
          {screen === 'gate'       && <div data-screen-label="05 Category Gate"><CategoryGateScreen /></div>}
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
