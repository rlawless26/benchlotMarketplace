<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  {{{fontCss}}}
  :root {
    --spruce: #1a3030; --spruce-light: #2a4a48; --bone: #f2f0eb; --bone-dark: #e8e6e0;
    --honey: #d4aa60; --honey-dark: #b08a40; --dark-teal: #0c1c1e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: {{width}}px; height: {{height}}px; overflow: hidden; }
  body {
    background: var(--bone); color: var(--dark-teal);
    font-family: 'Outfit', sans-serif; font-weight: 400;
    display: flex; flex-direction: column;
    -webkit-font-smoothing: antialiased;
  }
  .photo { position: relative; width: 1080px; height: 800px; background: var(--bone-dark); overflow: hidden; }
  .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .badge {
    position: absolute; top: 40px; left: 48px;
    background: var(--honey); color: var(--dark-teal);
    font-weight: 500; font-size: 26px; letter-spacing: 0.1em;
    padding: 12px 22px; border-radius: 10px;
  }
  .credit {
    position: absolute; right: 24px; bottom: 20px;
    background: rgba(12,28,30,0.72); color: var(--bone);
    font-size: 20px; padding: 6px 12px; border-radius: 6px;
  }

  .body { flex: 1; display: flex; flex-direction: column; padding: 44px 64px 48px; }
  .eyebrow { font-size: 24px; color: var(--spruce-light); font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; }
  .title {
    margin-top: 10px; font-family: 'Petrona', serif; font-weight: 700; color: var(--spruce);
    font-size: 58px; line-height: 1.08; letter-spacing: -0.01em;
    max-height: 2.2em; overflow: hidden;
  }
  .title.mid { font-size: 50px; }
  .title.long { font-size: 42px; }

  .row { margin-top: auto; display: flex; align-items: flex-end; justify-content: space-between; gap: 40px; }
  .price { font-family: 'Petrona', serif; font-weight: 700; font-size: 120px; line-height: 0.9; color: var(--honey); letter-spacing: -0.02em; }
  .price-label { margin-top: 12px; font-size: 24px; color: var(--spruce-light); }
  .guide { text-align: right; max-width: 520px; padding-bottom: 6px; }
  .guide-line { font-size: 30px; font-weight: 500; color: var(--spruce); line-height: 1.25; }
  .guide-sub { margin-top: 8px; font-size: 24px; color: var(--spruce-light); line-height: 1.3; }

  .foot { margin-top: 34px; padding-top: 22px; border-top: 2px solid var(--bone-dark); display: flex; justify-content: space-between; align-items: center; }
  .wordmark { font-family: 'Petrona', serif; font-weight: 700; font-size: 40px; color: var(--spruce); letter-spacing: 0.01em; }
  .path { font-size: 24px; color: var(--spruce-light); }
</style>
</head>
<body>
  <div class="photo">
    <img src="{{photo}}" alt="">
    <div class="badge">{{badge}}</div>
    <div class="credit">{{credit}}</div>
  </div>
  <div class="body">
    <div class="eyebrow">{{eyebrow}}</div>
    <div class="title {{titleClass}}">{{title}}</div>
    <div class="row">
      <div>
        <div class="price">{{price}}</div>
        <div class="price-label">{{priceLabel}}</div>
      </div>
      <div class="guide">
        <div class="guide-line">{{guideLine}}</div>
        <div class="guide-sub">{{guideSub}}</div>
      </div>
    </div>
    <div class="foot">
      <div class="wordmark">Benchlot</div>
      <div class="path">{{path}}</div>
    </div>
  </div>
</body>
</html>
