  {url: "https://i.ebayimg.com/images/g/gFEAAeSwfiVppNya/s-l1600.jpg", name: "sargent_bench_plane_1.jpg"},
  {url: "https://i.ebayimg.com/images/g/jZEAAeSw-Bpo~tDj/s-l1600.jpg", name: "stanley_no6_fore_plane.jpg"}
];

const ALL_IMAGES = [...R1_IMAGES, ...R2_IMAGES, ...R3_IMAGES];

let failed = [];
let currentSet = [];
const statusEl = document.getElementById('status');
const progressText = document.getElementById('progressText');
const progressFill = document.getElementById('progressFill');

function log(msg, cls) {
  statusEl.innerHTML += `<div class="${cls || ''}">${msg}</div>`;
  statusEl.scrollTop = statusEl.scrollHeight;
}

async function downloadOne(img) {
  try {
    const resp = await fetch(img.url);
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const blob = await resp.blob();
    const u = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = u; a.download = img.name;
    document.body.appendChild(a); a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(u), 1000);
    return {ok: true, size: blob.size};
  } catch(e) {
    return {ok: false, error: e.message};
  }
}

async function startDownload(images, label) {
  document.querySelectorAll('button').forEach(b => b.disabled = true);
  statusEl.innerHTML = '';
  failed = [];
  currentSet = images;
  let done = 0;
  log(`Starting download of ${images.length} images (${label})...`);

  for (const img of images) {
    const result = await downloadOne(img);
    done++;
    const pct = Math.round(done / images.length * 100);
    progressFill.style.width = pct + '%';
    progressText.textContent = `${done}/${images.length} (${pct}%)`;

    if (result.ok) {
      log(`\u2713 ${img.name} (${(result.size/1024).toFixed(0)} KB)`, 'ok');
    } else {
      log(`\u2717 ${img.name}: ${result.error}`, 'err');
      failed.push(img);
    }
    await new Promise(r => setTimeout(r, 400));
  }

  document.querySelectorAll('button').forEach(b => b.disabled = false);
  if (failed.length > 0) {
    log(`\n${failed.length} failed. Click "Retry" to try again.`);
    document.getElementById('downloadRemaining').style.display = 'inline-block';
  } else {
    log(`\n\u2713 All ${images.length} images downloaded!`, 'ok');
  }
}

async function downloadRemaining() {
  const toRetry = [...failed];
  failed = [];
  for (const img of toRetry) {
    const result = await downloadOne(img);
    if (result.ok) {
      log(`\u2713 RETRY: ${img.name} (${(result.size/1024).toFixed(0)} KB)`, 'ok');
    } else {
      log(`\u2717 RETRY: ${img.name}: ${result.error}`, 'err');
      failed.push(img);
    }
    await new Promise(r => setTimeout(r, 400));
  }
  if (failed.length === 0) {
    document.getElementById('downloadRemaining').style.display = 'none';
    log('\n\u2713 All retries succeeded!', 'ok');
  }
}
</script>
