let completed = 0;
let failed = [];

function log(msg, cls) {
  const el = document.getElementById('log');
  el.innerHTML += `<div class="${cls||''}">${msg}</div>`;
  el.scrollTop = el.scrollHeight;
}

function updateProgress() {
  const pct = Math.round((completed / images.length) * 100);
  const bar = document.getElementById('progressBar');
  bar.style.width = pct + '%';
  bar.textContent = pct + '%';
  document.getElementById('status').textContent = `Downloaded ${completed}/${images.length} (${failed.length} failed)`;
}

async function downloadOne(img) {
  try {
    const resp = await fetch(img.url);
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const blob = await resp.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = img.name;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    completed++;
    log(`✓ ${img.name}`, 'success');
  } catch(e) {
    failed.push(img);
    log(`✗ ${img.name}: ${e.message}`, 'error');
  }
  updateProgress();
}

async function startDownload() {
  document.getElementById('startBtn').disabled = true;
  completed = 0;
  failed = [];
  log('Starting download of 50 Round 5 test photos...');
  // Download in batches of 3 with delay
  for (let i = 0; i < images.length; i += 3) {
    const batch = images.slice(i, i + 3);
    await Promise.all(batch.map(downloadOne));
    if (i + 3 < images.length) await new Promise(r => setTimeout(r, 500));
  }
  log(`\nComplete! ${completed}/${images.length} downloaded.`, completed === images.length ? 'success' : 'error');
  document.getElementById('retryBtn').disabled = failed.length === 0;
  document.getElementById('startBtn').disabled = false;
}

async function retryFailed() {
  const toRetry = [...failed];
  failed = [];
  document.getElementById('retryBtn').disabled = true;
  log(`\nRetrying ${toRetry.length} failed downloads...`);
  for (const img of toRetry) {
    await downloadOne(img);
    await new Promise(r => setTimeout(r, 300));
  }
  document.getElementById('retryBtn').disabled = failed.length === 0;
}
</script>
