    <meta name="twitter:description" content="Buy and sell quality tools on Benchlot, the marketplace built for tool enthusiasts." />
    <meta name="twitter:image" content="https://benchlot.com/logo512.png" />

    <link rel="canonical" href="https://benchlot.com/" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Mulish:wght@300;400;500;600;700&display=swap" rel="stylesheet">
