    <text x="660" y="48" font-size="13" font-weight="600" fill="#1B1714">Lateral adjustment lever</text>
    <text x="660" y="62" font-size="11" fill="#7A6F66">Single-piece, twisted shaft. Type 11 tell.</text>

    <text x="630" y="96" font-size="11" font-weight="600" fill="#A85427" font-family="&#39;JetBrains Mono&#39;, monospace">02</text>
    <text x="660" y="96" font-size="13" font-weight="600" fill="#1B1714">Lever cap</text>
    <text x="660" y="110" font-size="11" fill="#7A6F66">Kidney-shaped hole = late types.</text>

    <text x="630" y="188" font-size="11" font-weight="600" fill="#A85427" font-family="&#39;JetBrains Mono&#39;, monospace">03</text>
    <text x="660" y="188" font-size="13" font-weight="600" fill="#1B1714">Frog + iron</text>
    <text x="660" y="202" font-size="11" fill="#7A6F66">Forward-arc receiver confirms Type 11.</text>

    <text x="630" y="218" font-size="11" font-weight="600" fill="#A85427" font-family="&#39;JetBrains Mono&#39;, monospace">04</text>
    <text x="660" y="218" font-size="13" font-weight="600" fill="#1B1714">Depth-adjustment wheel</text>
    <text x="660" y="232" font-size="11" fill="#7A6F66">Brass on early; nickel on later.</text>

    <text x="630" y="278" font-size="11" font-weight="600" fill="#A85427" font-family="&#39;JetBrains Mono&#39;, monospace">05</text>
    <text x="660" y="278" font-size="13" font-weight="600" fill="#1B1714">Low knob, rosewood</text>
    <text x="660" y="292" font-size="11" fill="#7A6F66">High knob arrives Type 14.</text>

    <text x="630" y="316" font-size="11" font-weight="600" fill="#A85427" font-family="&#39;JetBrains Mono&#39;, monospace">06</text>
    <text x="660" y="316" font-size="13" font-weight="600" fill="#1B1714">Tote</text>
    <text x="660" y="330" font-size="11" fill="#7A6F66">Rosewood, often refinished.</text>

    <text x="630" y="344" font-size="11" font-weight="600" fill="#A85427" font-family="&#39;JetBrains Mono&#39;, monospace">07</text>
    <text x="660" y="344" font-size="13" font-weight="600" fill="#1B1714">Mouth</text>
    <text x="660" y="358" font-size="11" fill="#7A6F66">Iron exits here. Check for chatter.</text>
